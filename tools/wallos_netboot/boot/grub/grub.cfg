set timeout=0
set default=0

# Common modules
insmod http
insmod tftp
insmod all_video
insmod gfxterm
insmod serial

# UEFI network support
if [ "$grub_platform" = "efi" ]; then
    insmod efinet
fi

# Initialize serial console: COM1, 115200 baud, 8N1
serial --unit=0 --speed=115200 --word=8 --parity=no --stop=1

# Output to both graphical console and serial
terminal_output gfxterm serial
terminal_input console serial

source /boot/grub/net_settings.cfg

# Initialize networking
net_bootp

menuentry "WallOS (Network Boot)" {
    set gfxmode=auto
    set gfxpayload=keep

    terminal_output gfxterm serial

    echo "Fetching WallOS via Network..."
    configfile (tftp,$server_ip)/grub/grub.cfg
}