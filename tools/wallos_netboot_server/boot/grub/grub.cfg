set timeout=2
set default=0

insmod serial
serial --unit=0 --speed=115200 --word=8 --parity=no --stop=1

insmod http
insmod all_video
insmod gfxterm

# UEFI-specific networking support
if [ "$grub_platform" = "efi" ]; then
    insmod efinet
fi

set gfxmode=auto
set gfxpayload=keep

terminal_output gfxterm serial
terminal_input console serial

source /boot/grub/net_settings.cfg

menuentry "WallOS (Network Build)" {
    echo "Fetching WallOS.bin via HTTP..."

    multiboot2 (http,$server_ip)/boot/WallOS.bin

    boot
}